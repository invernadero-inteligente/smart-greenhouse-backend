services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./nginx/templates:/etc/nginx/templates
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    env_file:
      - .env
    environment:
      DOMAIN: ${SERVER_DOMAIN}
    networks:
      - greenhouse-backend-net

  backend:
    build: .
    container_name: greenhouse-backend
    restart: always
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${POSTGRES_URI:-jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?${POSTGRES_EXTRA_PARAMS:-}}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_URL: ${POSTGRES_URI:-jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?${POSTGRES_EXTRA_PARAMS:-}}
      SPRING_FLYWAY_USER: ${POSTGRES_USER}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"
      SPRING_FLYWAY_BASELINE_VERSION: "0"
      SPRING_MONGO_URI: ${MONGO_URI}
      SPRING_MONGO_DATABASE: ${MONGO_DB}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID}
      MQTT_TOPIC_SENSORS: ${MQTT_TOPIC_SENSORS}
      MQTT_TOPIC_ACTUATORS: ${MQTT_TOPIC_ACTUATORS}
      MQTT_TOPIC_INFO: ${MQTT_TOPIC_INFO}
    depends_on:
      emqx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - greenhouse-backend-net

  emqx:
    image: emqx/emqx:latest
    container_name: greenhouse-emqx
    restart: always
    ports:
      - "1883:1883"
      - "18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - greenhouse-backend-net

networks:
  greenhouse-backend-net:
    driver: bridge

volumes:
  emqx_data:
  emqx_log:
