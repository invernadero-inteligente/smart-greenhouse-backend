services:
  postgres:
    image: postgres:16-alpine
    container_name: greenhouse-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invernadero_db}
      POSTGRES_USER: ${POSTGRES_USER:-invernadero_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invernadero_pass}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invernadero_user} -d ${POSTGRES_DB:-invernadero_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - greenhouse-backend-net
    env_file:
      - .env

  mongo:
    image: mongo:7
    container_name: greenhouse-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - greenhouse-backend-net
    env_file:
      - .env

  pgadmin:
    image: dpage/pgadmin4
    container_name: greenhouse-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@invernadero.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - greenhouse-backend-net
    env_file:
      - .env

  backend:
    build: .
    container_name: greenhouse-backend
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-invernadero_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-invernadero_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-invernadero_pass}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-invernadero_db}
      SPRING_FLYWAY_USER: ${POSTGRES_USER:-invernadero_user}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-invernadero_pass}
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"
      SPRING_FLYWAY_BASELINE_VERSION: "0"
      MQTT_BROKER_URL: tcp://emqx:1883
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      MQTT_CLIENT_ID: greenhouse-backend
      MQTT_TOPIC_SENSORS: /usco/sensores
      MQTT_TOPIC_ACTUATORS: /usco/actuadores
      MQTT_TOPIC_INFO: /usco/info
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      emqx:
        condition: service_healthy
    networks:
      - greenhouse-backend-net

  emqx:
    image: emqx/emqx:latest
    container_name: greenhouse-emqx
    restart: always
    ports:
      - "1883:1883"    # MQTT TCP
      - "18083:18083"  # Dashboard web de EMQX
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - greenhouse-backend-net

networks:
  greenhouse-backend-net:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  mongo_data:
  emqx_data:
  emqx_log:
